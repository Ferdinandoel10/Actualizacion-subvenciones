name: Actualizar convocatorias

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-convocatorias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar convocatorias vigentes
        run: python actualizar.py

      - name: Guardar cambios
        run: |
          git config user.name "actualizador-qmc"
          git config user.email "actualizador-qmc@users.noreply.github.com"
          git add convocatorias.json
          if git diff --cached --quiet; then
            echo "Sin cambios hoy"
          else
            git commit -m "Convocatorias actualizadas $(date -u +%F)"
            git push
          fi
